[project]
name = "shadowrun-tools"
version = "0.1.0"
description = "One-off utilities for extracting Shadowrun rules data from PDFs into JSON."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pillow>=10",
    "jsonschema>=4",
]

[tool.ruff]
line-length = 100
